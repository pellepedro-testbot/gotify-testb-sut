# Skyramp Workspace Configuration
workspace:
  repoName: pellepedro-testbot/gotify-testb-sut
  repoUrl: https://github.com/pellepedro-testbot/gotify-testb-sut
metadata:
  schemaVersion: v1
  executorVersion: v1.3.30
  createdAt: "2026-06-29T21:38:10.719Z"
  updatedAt: "2026-06-29T21:38:10.725Z"
services:
  - serviceName: gotify-server
    language: python
    framework: pytest
    testDirectory: tests/skyramp
    api:
      schemaPath: docs/spec.json
      authType: apiKey
      authHeader: X-Gotify-Key
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d --build
      serverStopCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . down -v
      runtime: docker
      dockerNetwork: gotify-testb-sut_default
  - serviceName: gotify-ui
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/ui
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d --build
      serverStopCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . down -v
      runtime: docker
      dockerNetwork: gotify-testb-sut_default
