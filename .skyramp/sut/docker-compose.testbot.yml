services:
  gotify:
    build:
      context: .
      dockerfile: .skyramp/sut/Dockerfile.testbot
    ports:
      - "8080:8080"
    environment:
      GOTIFY_SERVER_PORT: "8080"
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DATABASE_CONNECTION: data/gotify.db
      GOTIFY_DEFAULTUSER_NAME: admin
      GOTIFY_DEFAULTUSER_PASS: testbot-admin
      GOTIFY_PASSSTRENGTH: "4"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
